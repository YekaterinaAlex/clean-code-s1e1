<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <header class="header">
      <img src="./eisenhower-matrix.jpg" alt="The Eisenhower Matrix" class="header__img">
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="todo-app">
      <section class="add-section">
        <h3 class="section__title add-section__title">Add Item</h3>
        <div class="task-row-wrapper">
          <label class="add-section__label" for="new-task"></label>
          <input id="new-task" class="add-section__task" type="text">
          <button class="add-button">Add</button>
        </div>
      </section>
      <section class="todo-section">
        <h3 class="section__title">Todo</h3>
        <ul class="list" id="incompleted-tasks">
          <li class="list__item">
            <input class="list__item__checkbox" type="checkbox">
            <label class="list__item__label">Pay Bills</label>
            <input type="text" class="list__item__input">
            <button class="edit-button">Edit</button>
            <button class="delete-button">
              <img class="delete-button__img" src="./remove.svg" alt="remove button">
            </button>
          </li>
          <li class="list__item">
            <input class="list__item__checkbox" type="checkbox">
            <label class="list__item__label">Go Shopping</label>
            <input type="text" class="list__item__input">
            <button class="edit-button">Edit</button>
            <button class="delete-button">
              <img class="delete-button__img" src="./remove.svg" alt="remove button">
            </button>
          </li>
        </ul>
      </section>
      <section class="completed-section">
        <h3 class="section__title">Completed</h3>
        <ul class="list" id="completed-tasks">
          <li class="list__item">
            <input class="list__item__checkbox" type="checkbox" checked>
            <label class="list__item__label">See the Doctor</label>
            <input type="text" class="list__item__input">
            <button class="edit-button">Edit</button>
            <button class="delete-button">
              <img class="delete-button__img" src="./remove.svg" alt="remove button">
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
